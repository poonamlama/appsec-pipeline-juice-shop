name: DAST Scan - OWASP ZAP

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # lets you also trigger it manually from the GitHub Actions tab

permissions:
  contents: read
  issues: write

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start Juice Shop
        run: |
          docker run -d --name juice-shop -p 3000:3000 bkimminich/juice-shop
          echo "Waiting for Juice Shop to be ready..."
          for i in {1..30}; do
            if curl -s http://localhost:3000 > /dev/null; then
              echo "Juice Shop is up!"
              break
            fi
            sleep 2
          done

      - name: Run ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:3000'
          fail_action: false   # don't fail the whole pipeline yet; just report findings
          # This action automatically uploads its own report as an artifact
          # named "zap_scan", so no separate upload step is needed.