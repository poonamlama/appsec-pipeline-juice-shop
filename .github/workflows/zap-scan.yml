name: DAST Scan - OWASP ZAP

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # lets you also trigger it manually from the GitHub Actions tab

permissions:
  contents: read

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start Juice Shop
        run: |
          docker run -d --name juice-shop -p 3000:3000 bkimminich/juice-shop
          echo "Waiting for Juice Shop to be ready..."
          for i in {1..30}; do
            if curl -s http://localhost:3000 > /dev/null; then
              echo "Juice Shop is up!"
              break
            fi
            sleep 2
          done

      - name: Make report folder writable
        run: mkdir -p zap-report && chmod -R 777 zap-report

      - name: Run ZAP Baseline Scan directly via Docker
        run: |
          docker run --rm \
            --network host \
            -v $(pwd)/zap-report:/zap/wrk:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://localhost:3000 \
            -r zap-report.html \
            -J zap-report.json \
            -I
        # -I means "do not fail the step based on scan findings"; we only
        # want this pipeline to fail if ZAP itself crashes, not because it
        # found vulnerabilities (that's the point of the scan).

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-report/